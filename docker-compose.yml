version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk
      POSTGRES_DB: desk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: sh -c "alembic upgrade head && python -m app.seed"
    environment:
      DATABASE_URL: postgresql+psycopg://desk:desk@db:5432/desk
      SECRET_KEY: dev-secret-key-change-in-prod
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://desk:desk@db:5432/desk
      SECRET_KEY: dev-secret-key-change-in-prod
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
